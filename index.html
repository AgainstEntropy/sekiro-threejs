<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>隻狼 · Sekiro (three.js)</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='6' fill='%23b3261e'/%3E%3Ctext x='32' y='46' font-size='38' text-anchor='middle' fill='%23f2e8d8' font-family='serif'%3E%E7%8B%BC%3C/text%3E%3C/svg%3E" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #07080c; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; }
    #loading { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 2.2vh; background: radial-gradient(ellipse at 50% 40%, #1d1520 0%, #07080c 70%);
      color: #d8d0c0; font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; transition: opacity .8s ease; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .logo { font-size: 14vh; letter-spacing: .08em; color: #e9e2d2; text-shadow: 0 0 40px rgba(180, 30, 30, .35); }
    #loading .seal { width: 5vh; height: 5vh; border: 2px solid #b3261e; color: #b3261e; display: grid; place-items: center;
      font-size: 3vh; margin-top: -1vh; }
    #loading .status { font-size: 1.6vh; letter-spacing: .5em; text-transform: uppercase; opacity: .6; }
    #loading .bar { width: 22vh; height: 1px; background: rgba(216, 208, 192, .15); overflow: hidden; }
    #loading .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #b3261e;
      animation: slide 1.4s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading"><div class="logo">隻狼</div><div class="seal">狼</div><div class="bar"></div><div class="status" id="loading-status">Loading Ashina…</div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
