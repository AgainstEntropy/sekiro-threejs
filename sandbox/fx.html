<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FX sandbox</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #07080c; font: 12px/1.3 system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; }
    #ui { position: fixed; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 540px; z-index: 2; }
    #ui button { background: rgba(20,20,26,.8); color: #ddd; border: 1px solid #555; padding: 3px 7px; cursor: pointer; }
    #ui button:hover { background: #333; }
    #stats { position: fixed; right: 8px; top: 8px; color: #9c9; background: rgba(0,0,0,.5); padding: 4px 6px; white-space: pre; z-index: 2; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ui"></div>
  <div id="stats"></div>
  <script type="module" src="/sandbox/fx.js"></script>
</body>
</html>
