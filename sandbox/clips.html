<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clip Library Sandbox</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d22; color: #ddd; font: 12px/1.35 ui-monospace, Menlo, monospace; }
    #app { position: fixed; inset: 0; }
    #hud { position: fixed; left: 8px; top: 6px; pointer-events: none; text-shadow: 0 1px 2px #000; white-space: pre; }
    #warn { position: fixed; right: 8px; bottom: 6px; font-size: 10px; max-width: 40vw; max-height: 22vh; overflow: hidden; color: #f9a; white-space: pre-wrap; text-shadow: 0 1px 2px #000; pointer-events: none; }
    .lbl { color: #fff; font: 11px ui-monospace, Menlo, monospace; background: rgba(0,0,0,.55); padding: 1px 4px; border-radius: 3px; white-space: nowrap; }
    #panel { position: fixed; left: 8px; bottom: 8px; display: flex; gap: 6px; align-items: center; z-index: 2; }
    #panel button { background: #2a2d34; color: #ddd; border: 1px solid #444; font: inherit; cursor: pointer; }
    #panel select, #panel input { background: #2a2d34; color: #ddd; border: 1px solid #444; font: inherit; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud"></div>
  <div id="warn"></div>
  <div id="panel"></div>
  <script type="module" src="./clips.js"></script>
</body>
</html>
